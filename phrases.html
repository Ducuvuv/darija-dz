<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Phrases — Darija DZ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="has-tabbar" data-tab="home">
  <main class="site-wrap">
    <header class="flash-header">
      <a class="flash-back" href="./index.html">←</a>
      <h1 class="flash-title">Phrases</h1>
    </header>
    <p class="flash-intro">Phrases entières + dialogues. Choisis ton rôle A ou B, pause quand c’est à toi.</p>

    <p class="eyebrow">Dialogues A/B</p>
    <section class="deck-panel" id="dialogue-list"></section>

    <div class="dlg-stage" id="dlg-stage" hidden>
      <div class="dlg-stage-head">
        <strong id="dlg-title">Dialogue</strong>
        <button type="button" class="btn secondary btn-sm" id="dlg-close">Fermer</button>
      </div>

      <div class="dlg-role-pick" id="dlg-role-pick">
        <span class="field-label">Ton rôle</span>
        <div class="btn-row">
          <button type="button" class="btn secondary dlg-role-btn" data-role="auto">Auto</button>
          <button type="button" class="btn secondary dlg-role-btn" data-role="A">Je suis A</button>
          <button type="button" class="btn secondary dlg-role-btn" data-role="B">Je suis B</button>
        </div>
      </div>

      <p class="dlg-progress" id="dlg-progress">1 / 1</p>
      <div class="dialogue-player" id="dialogue-player">
        <p class="dlg-now">
          <span class="dlg-role-badge" id="dlg-role">A</span>
          <span class="arab" id="dlg-text"></span>
        </p>
        <p class="dlg-hint" id="dlg-hint"></p>
      </div>

      <div class="dlg-controls">
        <button type="button" class="btn secondary" id="dlg-prev" title="Précédent">‹</button>
        <button type="button" class="btn" id="dlg-play">▶ Lecture</button>
        <button type="button" class="btn secondary" id="dlg-pause">⏸ Pause</button>
        <button type="button" class="btn secondary" id="dlg-next" title="Suivant">›</button>
        <button type="button" class="btn secondary" id="dlg-replay" title="Réécouter">🔊</button>
      </div>
      <button type="button" class="btn btn-block" id="dlg-said" hidden>J’ai dit ma réplique →</button>

      <ol class="dlg-script" id="dlg-script"></ol>
    </div>

    <p class="eyebrow">Par deck</p>
    <div id="phrase-decks"></div>
  </main>
  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
  <script src="./data/cards.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/tts.js"></script>
  <script src="./js/shell-tabbar.js"></script>
  <script src="./js/phrases.js"></script>
</body>
</html>
