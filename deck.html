<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Deck — Darija DZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="has-tabbar" data-tab="home">
  <main class="site-wrap" id="deck-root">
    <header class="flash-header">
      <a class="flash-back" href="./index.html">←</a>
      <h1 class="flash-title" id="deck-title">Deck</h1>
    </header>

    <div class="deck-hero">
      <div class="deck-badges" id="deck-badges"></div>
      <p class="deck-meta" id="deck-meta"></p>
      <div class="progress-block">
        <div class="progress-track deck-progress"><i id="deck-progress-bar"></i></div>
        <span class="progress-label" id="deck-progress-label">0 / 0</span>
      </div>
      <div class="btn-row">
        <a class="btn" id="btn-flash" href="#">Flash (8 cartes)</a>
        <a class="btn secondary" id="btn-flemme" href="#">Mode flemme</a>
      </div>
    </div>

    <section class="deck-panel" id="mini-exos"></section>

    <p class="eyebrow">Cartes du deck</p>
    <section class="deck-panel" id="card-list"></section>
  </main>

  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>

  <script src="./data/cards.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/flash-srs.js"></script>
  <script src="./js/shell-tabbar.js"></script>
  <script src="./js/deck.js"></script>
</body>
</html>
