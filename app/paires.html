<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Paires — Darija DZ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="has-tabbar" data-tab="home">
  <main class="site-wrap flash-page">
    <header class="flash-header">
      <a class="flash-back" href="./index.html">←</a>
      <h1 class="flash-title">Paires</h1>
    </header>

    <section id="pairs-setup">
      <p class="flash-intro">Contrasts forcés : <strong>rak/raki</strong>, <strong>kayen/makach</strong>, Sétif ↔ national. 8 paires · 5 min.</p>

      <div class="flash-panel flash-modes">
        <label class="flash-check"><input type="radio" name="pairs-mode" value="flip" checked /> Flip (vois A → révèle B)</label>
        <label class="flash-check"><input type="radio" name="pairs-mode" value="choix" /> Choix (donne le contraste)</label>
        <label class="flash-check"><input type="checkbox" id="pairs-setif" /> Inclure paires Sétif ↔ national</label>
      </div>

      <button type="button" class="btn btn-block" id="btn-pairs-start">Commencer</button>
    </section>

    <section id="pairs-play" hidden>
      <div class="flash-top">
        <span id="pairs-progress">1 / 8</span>
        <span id="pairs-timer" class="flash-timer">05:00</span>
        <button type="button" class="btn secondary btn-sm" id="btn-pairs-exit">Sortir</button>
      </div>

      <p class="pairs-theme" id="pairs-theme"></p>
      <div class="flash-card pairs-card" id="pairs-card">
        <p class="flash-card-meta" id="pairs-meta">—</p>
        <div id="pairs-body"></div>
      </div>

      <div class="pairs-actions" id="pairs-actions"></div>
    </section>

    <section id="pairs-end" hidden>
      <div class="end-box">
        <h2>Paires terminées</h2>
        <p id="pairs-end-stats">—</p>
        <p class="end-note">Les contrasts collent mieux que les listes. Reviens demain.</p>
        <div class="btn-row">
          <button type="button" class="btn" id="btn-pairs-replay">Rejouer</button>
          <button type="button" class="btn secondary" id="btn-pairs-home">Accueil</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>

  <script src="./data/pairs.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/shell-tabbar.js"></script>
  <script src="./js/tts.js"></script>
  <script src="./js/paires.js"></script>
</body>
</html>
