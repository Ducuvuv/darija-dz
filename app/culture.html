<body class="has-tabbar" data-tab="home">

    <p class="flash-intro">Villes, figures, fun facts — pour parler <em>avec</em> le pays, pas seulement conjuguer.</p>

    <div class="culture-tabs" id="culture-tabs" role="tablist">
      <button type="button" class="btn secondary culture-tab active" data-tab="villes">Villes</button>
      <button type="button" class="btn secondary culture-tab" data-tab="figures">Figures</button>
      <button type="button" class="btn secondary culture-tab" data-tab="facts">Fun facts</button>
    </div>

    <section id="panel-villes" class="culture-panel"></section>
    <section id="panel-figures" class="culture-panel" hidden></section>

      <div class="btn-row" style="margin-bottom:0.75rem">
        <button type="button" class="btn" id="btn-facts-flash">Flash 8 facts</button>
        <button type="button" class="btn secondary" id="btn-facts-shuffle">Mélanger</button>
      </div>
      <div id="facts-flash" class="facts-flash" hidden></div>
      <div id="facts-list"></div>
    </section>

    <div class="btn-row">
