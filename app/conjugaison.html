<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Conjugaison — Darija DZ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="has-tabbar" data-tab="home">
  <main class="site-wrap">
    <header class="flash-header">
      <a class="flash-back" href="./verbes.html">←</a>
      <h1 class="flash-title">Conjugaison</h1>
    </header>
    <p class="flash-intro">18 verbes × 8 personnes × 6 temps (+ impératif). Dis à voix haute — c’est le point musculation.</p>

    <div class="culture-tabs" id="conj-tabs">
      <button type="button" class="btn secondary culture-tab active" data-panel="table">Tableaux</button>
      <button type="button" class="btn secondary culture-tab" data-panel="drill">Drill 8</button>
      <button type="button" class="btn secondary culture-tab" data-panel="notes">Mémo</button>
    </div>

    <section id="panel-table" class="conj-panel">
      <div class="flash-panel">
        <label class="field-label" for="conj-verb">Verbe</label>
        <select id="conj-verb" class="flash-select"></select>
      </div>
      <div class="flash-panel">
        <label class="field-label" for="conj-tense">Temps</label>
        <select id="conj-tense" class="flash-select"></select>
      </div>
      <p class="conj-tip" id="conj-tip"></p>
      <p class="conj-note" id="conj-note" hidden></p>
      <div id="conj-imperative" class="conj-imp" hidden></div>
      <div class="table-scroll">
        <table class="verb-table conj-full" id="conj-table"></table>
      </div>
      <button type="button" class="btn secondary" id="btn-conj-speak-all">🔊 Lire la colonne</button>
    </section>

    <section id="panel-drill" class="conj-panel" hidden>
      <p class="flash-intro" style="margin-top:0">On tire verbe + personne + temps. Tu dis, puis tu révèles.</p>
      <div class="flash-card pairs-card" id="drill-card">
        <p class="flash-card-meta" id="drill-meta">—</p>
        <p class="listen-prompt" id="drill-prompt">—</p>
        <p class="flash-fr" id="drill-fr">—</p>
        <div id="drill-answer" hidden>
          <p class="arab flash-arab" id="drill-arab"></p>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" id="drill-reveal">Révéler</button>
        <button type="button" class="btn secondary" id="drill-speak">🔊</button>
        <button type="button" class="btn secondary" id="drill-next">Suivant</button>
      </div>
      <p class="muted" id="drill-stats">0 révélées</p>
    </section>

    <section id="panel-notes" class="conj-panel" hidden>
      <div class="deck-panel" id="notes-list"></div>
      <div class="btn-row">
        <a class="btn secondary" href="./verbes.html">Modèles courts</a>
        <a class="btn secondary" href="./cours.html">Cours</a>
        <a class="btn secondary" href="./flashcards.html?mode=typing">Clavier عرب</a>
      </div>
    </section>
  </main>
  <nav class="tabbar" aria-label="Navigation"><div class="tabbar-inner"></div></nav>
  <script src="./data/conjugaison.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/tts.js"></script>
  <script src="./js/shell-tabbar.js"></script>
  <script src="./js/conjugaison.js"></script>
</body>
</html>
